name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom release tag (e.g. v1.0.0)'
        required: false
        default: ''
      release_notes:
        description: 'Custom release notes (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  checks:
    name: Format, analyze, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

  android-unit-tests:
    name: Android unit tests
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;37.0.0

      - name: Flutter pub get
        run: flutter pub get

      - name: Run native unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  debug-apk:
    name: Build debug APK
    needs: [checks, android-unit-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;37.0.0

      - name: Flutter pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Verify debug APK signature and checksums
        run: |
          APK=build/app/outputs/flutter-apk/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" > build/app/outputs/flutter-apk/app-debug.apk.sha256
          cat build/app/outputs/flutter-apk/app-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256

  release-apk:
    name: Build release APK and publish release
    needs: [checks, android-unit-tests]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;37.0.0

      - name: Flutter pub get
        run: flutter pub get

      - name: Extract version from pubspec
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/.*version: //' | cut -d' ' -f1)
          VERSION_CODE=$(echo "$VERSION" | cut -d'+' -f2)
          VERSION_NAME=$(echo "$VERSION" | cut -d'+' -f1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT

      - name: Decode signing keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/mouvi-release.jks

      - name: Write signing properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf 'storeFile=mouvi-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties

      - name: Build release APKs (split per ABI, with retries)
        run: |
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            if flutter build apk --release --split-per-abi \
              --target-platform android-arm,android-arm64; then
              echo "Build succeeded on attempt $i"
              exit 0
            fi
            echo "Build failed on attempt $i, retrying in 10 seconds..."
            sleep 10
          done
          echo "Build failed after $MAX_RETRIES attempts"
          exit 1

      - name: Generate changelog
        id: changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            COMMIT_RANGE="${GITHUB_SHA}^..${GITHUB_SHA}"
          else
            COMMIT_RANGE="${LAST_TAG}..${GITHUB_SHA}"
          fi
          echo "commit_range=$COMMIT_RANGE" >> $GITHUB_OUTPUT
          CHANGELOG=$(git log --pretty=format:"- %s" $COMMIT_RANGE || true)
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No changes since last release"
          fi
          echo "$CHANGELOG" > changelog.txt

      - name: Determine release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="v${{ steps.version.outputs.version_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && env.KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          APK_ARM64="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          APK_ARM="build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          CHANGELOG=$(cat changelog.txt)
          SHA_ARM64=$(sha256sum "$APK_ARM64" | awk '{print $1}')
          SHA_ARM=$(sha256sum "$APK_ARM" | awk '{print $1}')

          {
            echo "## Mouvi v${VERSION_NAME} (build ${VERSION_CODE})"
            echo ""
            echo "### 📦 Установка"
            echo ""
            echo "Скачайте APK для своей архитектуры и установите на Android-устройство:"
            echo ""
            echo "| Файл | Для чего |"
            echo "|------|----------|"
            echo "| **app-arm64-v8a-release.apk** | Почти все современные телефоны |"
            echo "| **app-armeabi-v7a-release.apk** | Старые 32-битные устройства |"
            echo ""
            echo "Если не уверены — берите arm64-v8a. При первой установке потребуется разрешить **VPN-права** в настройках системы."
            echo ""
            echo "> Если ранее был установлен APK из v1.0.0 (подпись debug), его нужно удалить перед установкой этого релиза: ключ подписи изменился."
            echo ""
            echo "### 🔧 Что нового"
            echo ""
            echo "$CHANGELOG"
            echo ""
            echo "### 📱 Поддерживаемые протоколы"
            echo ""
            echo "| Протокол | Статус |"
            echo "|----------|--------|"
            echo "| WireGuard | ✅ |"
            echo "| AmneziaWG | ✅ (нужны H1–H4) |"
            echo "| WARP (Cloudflare) | ✅ как WireGuard |"
            echo "| VLESS | ✅ (Xray-core + tun2socks: TCP/WS, TLS/Reality, xtls-rprx-vision) |"
            echo "| OpenVPN | 📋 Импорт есть, подключение планируется |"
            echo "| Trojan / Shadowsocks | 📋 Импорт есть, подключение планируется |"
            echo ""
            echo "### 🛠 Сборка"
            echo ""
            echo "- Flutter 3.47.7"
            echo "- Android SDK API 35"
            echo "- Kotlin / JDK 17"
            echo ""
            echo "### 📄 SHA-256"
            echo ""
            echo "**app-arm64-v8a-release.apk**"
            echo '```'
            echo "$SHA_ARM64"
            echo '```'
            echo ""
            echo "**app-armeabi-v7a-release.apk**"
            echo '```'
            echo "$SHA_ARM"
            echo '```'
            echo ""
            echo "Создано автоматически через GitHub Actions."
          } > release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating assets and notes..."
            gh release upload "$TAG" "$APK_ARM64" "$APK_ARM" --clobber
            gh release edit "$TAG" \
              --title "Mouvi v${VERSION_NAME}" \
              --notes-file release-notes.md \
              --latest
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --target "${GITHUB_SHA}" \
              --title "Mouvi v${VERSION_NAME}" \
              --notes-file release-notes.md \
              --latest \
              "$APK_ARM64" "$APK_ARM"
          fi
